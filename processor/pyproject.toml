[project]
name = "dominican-llm-processor"
version = "0.1.0"
description = "Plain-text processing and deduplication for the Dominican corpus"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Cristian de la Hoz" }]
dependencies = [
  "beautifulsoup4==4.14.3",
  "datasketch==1.9.0",
  "faiss-cpu==1.13.2",
  "mistune==3.2.0",
  "numpy==2.4.2",
  "pyyaml==6.0.3",
  "wordfreq==3.1.1",
]

[project.optional-dependencies]
reports = [
  "playwright>=1.54.0",
]
analysis = [
  "ipykernel>=6.29.0",
  "jupyter>=1.1.0",
  "matplotlib>=3.9.0",
  "nltk>=3.9.0",
  "pandas>=2.3.0",
  "scikit-learn>=1.6.0",
  "seaborn>=0.13.0",
]
experiments = [
  "datasets>=3.0.0",
  "requests>=2.31.0",
  "warcio>=1.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff==0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dominican_llm_processor"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]
