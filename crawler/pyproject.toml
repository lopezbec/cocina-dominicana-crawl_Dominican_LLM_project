[project]
name = "dominican-llm-scraper"
version = "0.2.0"
description = "Web scraper for collecting Dominican Spanish dialect data for LLM training"
readme = { file = "readme.markdown", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cristian de la Hoz" }]
keywords = [
  "web-scraping",
  "dominican-spanish",
  "llm-training-data",
  "dialect",
  "corpus-building",
  "nlp",
]

dependencies = [
  "firecrawl-py>=4.18.0",
  "python-dotenv>=1.2.1",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/dominican_llm_scraper"]

[tool.hatch.build.targets.sdist]
include = ["src/dominican_llm_scraper", "readme.markdown", "config", "Makefile"]

[project.urls]
Homepage = "https://github.com/lopezbec/cocina-dominicana-crawl_Dominican_LLM_project"
Repository = "https://github.com/lopezbec/cocina-dominicana-crawl_Dominican_LLM_project"
Issues = "https://github.com/lopezbec/cocina-dominicana-crawl_Dominican_LLM_project/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.14.0"]
